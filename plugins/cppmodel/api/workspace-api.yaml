openapi: 3.0.3
info:
  title: CppModel Public REST API
  description: >
    REST API for the CppModel simulation platform.
  version: 0.4.0
  contact:
    name: CppModel
    url: https://cppmodel.com
servers:
  - url: https://{workspace}.cppmodel.com/api
    description: Dedicated per-customer workspace (licensed accounts)
    variables:
      workspace:
        default: w100435
        description: >
          Workspace subdomain, assigned when the workspace is provisioned.
  - url: https://free-workspace.cppmodel.com/api
    description: Shared workspace for free accounts
security:
  - keycloak: []
tags:
  - name: Simulations
    description: Endpoints related to managing and executing simulations.
  - name: System
    description: Health, version, and other system-level endpoints.
paths:

  /simulations:
    get:
      tags:
        - Simulations
      operationId: simulations_get
      summary: List simulations
      description: >
        Get a paginated list of simulations. Use scope=team to include all
        simulations in the user's team.
      parameters:
        - name: scope
          in: query
          description: Set to "team" to list all simulations in the user's team.
          required: false
          schema:
            type: string
            enum:
              - user
              - team
            default: user
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of simulations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationListResponse"
              examples:
                user:
                  summary: User's own simulations
                  value:
                    {
                      "items":
                        [
                          { "id": "home-temperature", "name": "Home temperature", "totalExecutions": 240 },
                          { "id": "server-requests", "name": "Server requests", "totalExecutions": 43 },
                        ],
                      "total": 4,
                      "limit": 50,
                      "offset": 0,
                    }
                team:
                  summary: Team simulations
                  value:
                    {
                      "items":
                        [
                          { "id": "home-temperature", "name": "Home temperature", "owner": "user1@cppmodel.com", "totalExecutions": 240 },
                          { "id": "server-requests", "name": "Server requests", "owner": "user2@cppmodel.com", "totalExecutions": 43 },
                        ],
                      "total": 4,
                      "limit": 50,
                      "offset": 0,
                    }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /simulations/{simulationId}:
    get:
      tags:
        - Simulations
      operationId: simulations_simulation_get
      summary: Get latest simulation results
      description: >
        Get the latest execution of this simulation - the inputs and
        parameters it read plus the outputs it produced. Same shape as
        GET /simulations/{simulationId}/executions/{executionId}.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      responses:
        "200":
          description: Latest execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationExecution"
              examples:
                default:
                  $ref: "#/components/examples/SimulationExecutionExample"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Simulation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /simulations/{simulationId}/inputs:
    get:
      tags:
        - Simulations
      operationId: simulations_simulation_inputs_get
      summary: Get pending inputs and parameters
      description: >
        Get the input / parameter document waiting to be consumed by the next
        execution of this simulation - whatever was last submitted via POST
        (from the front end or this API) and not yet consumed. Returns 404
        when nothing is pending, which is the normal state after an
        execution.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      responses:
        "200":
          description: Pre-execution input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationInputs"
              examples:
                default:
                  $ref: "#/components/examples/SimulationInputsExample"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No input data pending for this simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                { "code": "NOT_FOUND", "message": "No input data found for simulation 'Velocity profile'." }
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Simulations
      operationId: simulations_simulation_inputs_post
      summary: Submit pre-execution inputs and parameters
      description: >
        Set the input / parameter document for the next execution of this
        simulation, replacing any document still pending - send every input
        and parameter that execution should see, not just the changed ones.
        The document is consumed by the next execution (one-shot): when the
        simulation binary starts it fetches the pending document, and
        afterwards GET returns 404 until something is posted again. Post
        right before each run. CppModel_getInput* / inputs["..."] read the
        posted input series and CppModel_getParameter* / parameters["..."] the
        posted parameters; a name that isn't posted returns the call's
        fallback value. The execution records the values actually read (see
        SimulationExecution), which is how to confirm a posted document was
        applied. The simulation does not need to have run before. The server
        currently stores the body as given without validating it - clients
        should validate against SimulationInputs before posting.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInputs"
            examples:
              default:
                $ref: "#/components/examples/SimulationInputsExample"
      responses:
        "204":
          description: Input data saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Simulation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /simulations/{simulationId}/executions:
    get:
      tags:
        - Simulations
      operationId: simulations_simulation_executions_get
      summary: List executions for a simulation
      description: >
        Get a paginated list of execution summaries for this simulation,
        ordered by most recent first.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of executions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionListResponse"
              example:
                {
                  "items":
                    [
                      { "id": "exec-001", "createdAt": "2026-03-20T14:30:00Z", "status": "completed" },
                      { "id": "exec-002", "createdAt": "2026-03-21T09:15:00Z", "status": "completed" },
                    ],
                  "total": 2,
                  "limit": 50,
                  "offset": 0,
                }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Simulation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /simulations/{simulationId}/executions/{executionId}:
    get:
      tags:
        - Simulations
      operationId: simulations_simulation_execution_get
      summary: Get execution data by ID
      parameters:
        - $ref: "#/components/parameters/SimulationId"
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: Execution data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationExecution"
              examples:
                default:
                  $ref: "#/components/examples/SimulationExecutionExample"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Simulation or execution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /version:
    get:
      tags:
        - System
      operationId: version_get
      summary: Get API version
      security: []
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
              example:
                { "version": "0.4.0", "build": "abc123" }

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error description.

    PaginationMeta:
      type: object
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
          description: Total number of items matching the query.
        limit:
          type: integer
        offset:
          type: integer

    SimulationSummary:
      type: object
      required:
        - id
        - name
        - totalExecutions
      properties:
        id:
          type: string
          description: >
            The simulation's display name, exactly as passed to
            CMODEL_SIMULATE(...) in the source. Not a slug or UUID - may
            contain spaces and other characters, and must be percent-encoded
            when used in a URL path.
        name:
          type: string
          description: Human-readable display name.
        owner:
          type: string
          description: >
            Email of the last team member who submitted an execution for this
            simulation. Present when scope=team.
        totalExecutions:
          type: integer

    SimulationListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SimulationSummary"

    InputSeries:
      type: object
      description: >
        One input signal. Between points the value is held (zero-order hold):
        at simulation time t the input reads the y of the latest x <= t. A
        sharp step therefore needs only one point at the step time; pairs like
        x=[99, 100] with y=[20, 0] are equivalent and just make the step
        explicit when plotted.
      required:
        - label
        - x
        - y
      properties:
        label:
          type: string
          description: >
            Signal name, exactly as passed to CppModel_getInput*(...) /
            inputs["..."] (or, in execution results, CppModel_setOutput*(...) /
            outputs["..."]) - including any unit suffix like " [mm/s]".
        x:
          type: array
          minItems: 1
          description: Simulation time in milliseconds, ascending.
          items:
            type: number
        y:
          type: array
          minItems: 1
          description: Values, same length as x.
          items:
            type: number

    SimulationInputs:
      type: object
      description: >
        Pre-execution data for one simulation: time-varying inputs plus
        constant parameters.
      required:
        - inputs
        - parameters
      properties:
        executionTime:
          type: string
          description: >
            When this input set was prepared, formatted "DD-MM-YYYY HH:MM:SS".
            Informational.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/InputSeries"
        parameters:
          type: object
          description: >
            Parameter name -> numeric value, names exactly as passed to
            CppModel_getParameter*(...) (C) or parameters["..."] (C++). Keys
            prefixed "CppModel." are reserved and describe the simulation's
            own timing, in seconds (unlike input x values, which are in
            milliseconds): CppModel.SimulationTime (total time) and
            CppModel.SimulationStepSize (step size).
          additionalProperties:
            type: number

    SimulationExecution:
      description: >
        One execution: the inputs and parameters the simulation actually read
        (a name it read but that wasn't posted appears with its fallback
        value; a posted name it never read doesn't appear at all) plus every
        output it produced. Series are change-compressed: x holds only the
        times at which the value changed, plus the final time, so read them
        with the same hold-last-value rule as inputs.
      allOf:
        - $ref: "#/components/schemas/SimulationInputs"
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              description: >
                Outputs, one per CppModel_setOutput* / outputs["..."] name,
                including CppModel.StepResult (1 = cycle passed, 0 = failed).
              items:
                $ref: "#/components/schemas/InputSeries"

    ExecutionSummary:
      type: object
      required:
        - id
        - createdAt
        - status
      properties:
        id:
          type: string
          description: Unique execution identifier.
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - completed
            - failed

    ExecutionListResponse:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ExecutionSummary"

    VersionInfo:
      type: object
      required:
        - version
      properties:
        version:
          type: string
        build:
          type: string
          description: Build hash or identifier.

  responses:
    UnauthorizedError:
      description: Authentication token is missing or invalid
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            { "code": "UNAUTHORIZED", "message": "Authentication token is missing or invalid." }
    BadRequest:
      description: Request body is malformed or fails validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            { "code": "BAD_REQUEST", "message": "Request body is invalid." }
    Forbidden:
      description: Authenticated but insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            { "code": "FORBIDDEN", "message": "You do not have permission to perform this action." }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            { "code": "RATE_LIMIT", "message": "Too many requests. Please retry after 60 seconds." }

  examples:
    SimulationInputsExample:
      summary: Velocity profile with acceleration/braking windows
      value:
        {
          "executionTime": "22-09-2026 05:33:47",
          "inputs":
            [
              {
                "label": "Acceleration Window Active",
                "x": [0, 99, 100, 299, 300, 399, 400, 1200],
                "y": [20.0, 20.0, 0.0, 0.0, 20.0, 20.0, 0.0, 0.0],
              },
              {
                "label": "Braking Window Active",
                "x": [0, 599, 600, 699, 700, 899, 900, 999, 1000, 1200],
                "y": [0.0, 0.0, -20.0, -20.0, 0.0, 0.0, -20.0, -20.0, 0.0, 0.0],
              },
              {
                "label": "Desired Velocity [mm/s]",
                "x": [0, 299, 300, 599, 600, 899, 900, 1200],
                "y": [50.0, 50.0, 150.0, 150.0, 30.0, 30.0, 0.0, 0.0],
              },
            ],
          "parameters":
            {
              "Acceleration Window [ms]": 100,
              "Braking Window [ms]": 100,
              "CppModel.SimulationStepSize": 0.001,
              "CppModel.SimulationTime": 1.2,
              "Max Acceleration [m/s^2]": 4.0,
            },
        }

    SimulationExecutionExample:
      summary: A 1 s run with 100 ms steps where no inputs were posted
      value:
        {
          "executionTime": "29-09-2026 14:15:42",
          "inputs": [{ "label": "Test Input", "x": [0, 1000], "y": [-1.0, -1.0] }],
          "parameters":
            {
              "CppModel.SimulationStepSize": 0.1,
              "CppModel.SimulationTime": 1.0,
              "Gain": 1.0,
              "Limit": 100.0,
            },
          "results":
            [
              { "label": "CppModel.StepResult", "x": [0, 1000], "y": [1.0, 1.0] },
              { "label": "Out", "x": [0, 1000], "y": [-1.0, -1.0] },
            ],
        }

  parameters:
    SimulationId:
      name: simulationId
      in: path
      description: >
        The simulation's display name, exactly as passed to
        CMODEL_SIMULATE(...) in the source. Not a slug or UUID - may contain
        spaces and other characters, and must be percent-encoded when used in
        a URL path.
      required: true
      schema:
        type: string
    ExecutionId:
      name: executionId
      in: path
      description: Unique string identifying the execution.
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      description: Number of items to skip.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  securitySchemes:
    keycloak:
      type: openIdConnect
      openIdConnectUrl: https://auth.cppmodel.com/realms/CppModel/.well-known/openid-configuration
      description: >
        Obtain a token via the Resource Owner Password Credentials grant
        against the token_endpoint from the discovery document above, using
        client_id=cppmodel-frontend (public client, no client_secret) and your
        CppModel username/password. Access tokens are short-lived
        (expires_in is typically 300s) - fetch a new one per session rather
        than caching it. This is an interim mechanism; a dedicated API client
        (and possibly long-lived tokens) is planned to replace it.
